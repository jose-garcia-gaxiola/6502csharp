name: Build, test, and package

on:
  push:
    branches:
      - feat/**
      - Feat/**
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?)$ ]]; then
            echo "::error::Release tags must be vMAJOR.MINOR.PATCH with an optional prerelease suffix."
            exit 1
          fi
          echo "PACKAGE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore tests/Components.RegressionTests.csproj

      - name: Build
        run: dotnet build tests/Components.RegressionTests.csproj --configuration Release --no-restore

      - name: Run regression tests
        run: dotnet run --project tests/Components.RegressionTests.csproj --configuration Release --no-build --no-restore

      - name: Pack
        shell: bash
        run: |
          version_args=()
          if [[ -n "${PACKAGE_VERSION:-}" ]]; then
            version_args+=("-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet pack Components.csproj --configuration Release --no-build --no-restore \
            --output artifacts "${version_args[@]}"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/$PACKAGE_OWNER/index.json" \
            --name github --username "$PACKAGE_OWNER" \
            --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          dotnet nuget push "artifacts/*.nupkg" --source github --api-key "$NUGET_AUTH_TOKEN"
